services:
  # Backend FastAPI Service
  - type: web
    name: trademark-scraper-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SCRAPER_SCHEDULE_ENABLED
        value: "true"
      - key: DOWNLOAD_DIR
        value: "downloads"
      - key: ALLOWED_ORIGINS
        value: '["*"]'

  # Frontend React SPA
  - type: static
    name: trademark-scraper-frontend
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
